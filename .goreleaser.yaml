version: 2

project_name: decsr

builds:
  - id: decsr
    main: ./cmd/decsr
    binary: decsr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: decsr
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Homebrew tap. goreleaser v2.10+ deprecates `brews` (formulas) in favour of
# casks. The cask is only pushed when HOMEBREW_TAP_GITHUB_TOKEN is set, so a
# release does not fail while the tap repo or the secret do not exist yet.
homebrew_casks:
  - name: decsr
    ids: [decsr]
    binaries: [decsr]
    homepage: https://github.com/Decsr/Decsr-Code
    description: Drive a team of AI agents through a structured software development pipeline
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      owner: Decsr
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/decsr"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
